name: Build Kathodaya Video Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout Drift source
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift
          path: drift
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

      - name: Install Qt
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall

          aqt install-qt linux desktop 6.11.1 linux_gcc_64 \
            -O "$HOME/Qt"

          aqt install-qt linux android 6.11.1 android_arm64_v8a \
            -O "$HOME/Qt"

          echo "QT_ROOT=$HOME/Qt/6.11.1" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.11.1/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.11.1/android/bin" >> "$GITHUB_PATH"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          java -version
          cmake --version
          adb version || true
          qmake --version || true
          ls -la "$QT_ROOT" || true

      - name: Prepare Drift submodules
        working-directory: drift
        run: |
          git submodule update --init --recursive

      - name: Make Drift scripts executable
        working-directory: drift
        run: |
          chmod +x scripts/build.sh || true
          chmod +x third_party/build-android.sh || true
          chmod +x third_party/build-skia.sh || true

      - name: Build Drift Android dependencies
        working-directory: drift
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          if [ -f third_party/build-android.sh ]; then
            ./third_party/build-android.sh arm64-v8a
          fi

          if [ -f third_party/build-skia.sh ]; then
            ./third_party/build-skia.sh arm64-v8a
          fi

      - name: Build Drift APK
        working-directory: drift
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK_ROOT }}
          QT_ROOT: ${{ env.QT_ROOT }}
        run: |
          ./scripts/build.sh arm64-v8a Release

      - name: Find generated APK
        run: |
          echo "Searching for APK files..."
          find drift -type f -name "*.apk" -print

      - name: Copy APK to workspace
        run: |
          mkdir -p output

          APK="$(find drift -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          cp "$APK" "output/Kathodaya-Video-Editor-arm64.apk"

          echo "APK created:"
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kathodaya-Video-Editor-APK
          path: output/Kathodaya-Video-Editor-arm64.apk
          if-no-files-found: error
          retention-days: 14
